<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TAANISH | Receipt</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }

        .receipt {
            width: 58mm;
            max-width: 58mm;
            margin: auto;
            background: #fff;
            padding: 4mm 3mm;
            font-size: 10px;
        }

        .center {
            text-align: center;
        }

        /* =========================
           BRAND
        ========================= */

        .shop-name {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 2px;
        }

        .shop-subtitle {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .shop-info {
            font-size: 9px;
            line-height: 1.4;
        }

        /* =========================
           LINE
        ========================= */

        .line {
            border-top: 1px dashed #000;
            margin: 7px 0;
        }

        /* =========================
           INVOICE INFO
        ========================= */

        .invoice-info {
            font-size: 9px;
            line-height: 1.6;
        }

        .invoice-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .invoice-row strong {
            font-weight: 700;
        }

        .invoice-value {
            text-align: right;
            word-break: break-word;
        }

        /* =========================
           ITEMS TABLE
        ========================= */

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin-top: 5px;
        }

        th {
            font-size: 8px;
            font-weight: 700;
            border-bottom: 1px solid #000;
            padding: 4px 0;
        }

        td {
            font-size: 8.5px;
            padding: 5px 0;
            vertical-align: top;
            word-break: break-word;
        }

        .item {
            width: 30%;
            text-align: left;
        }

        .mrp {
            width: 17%;
            text-align: right;
        }

        .rate {
            width: 18%;
            text-align: right;
        }

        .qty {
            width: 12%;
            text-align: center;
        }

        .total {
            width: 23%;
            text-align: right;
        }

        /* =========================
           TOTAL
        ========================= */

        .summary {
            margin-top: 5px;
            font-size: 9px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }

        .round-off {
            font-size: 9px;
        }

        .grand-total {
            margin-top: 3px;
            padding: 7px 0;
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;

            font-size: 14px;
            font-weight: 800;
        }

        /* =========================
           PAYMENT
        ========================= */

        .payment {
            margin-top: 7px;
            font-size: 9px;
            line-height: 1.7;
        }

        .payment-row {
            display: flex;
            justify-content: space-between;
        }

        .change {
            font-weight: 800;
        }

        /* =========================
           FOOTER
        ========================= */

        .thank-you {
            margin-top: 12px;
            font-size: 9px;
            font-weight: 700;
        }

        .thank-sub {
            margin-top: 3px;
            font-size: 8px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            width: 58mm;
            max-width: 58mm;
            margin: 15px auto;
            display: flex;
            gap: 6px;
        }

        button {
            flex: 1;
            padding: 10px 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }

        .print-btn {
            background: #111;
            color: #fff;
        }

        .back-btn {
            background: #ddd;
            color: #111;
        }

        /* =========================
           ERROR
        ========================= */

        .error {
            text-align: center;
            color: #b00000;
            font-size: 11px;
            line-height: 1.5;
        }

        /* =========================
           PRINT
        ========================= */

        @media print {

            @page {
                size: 58mm auto;
                margin: 0;
            }

            html,
            body {
                width: 58mm;
                margin: 0;
                padding: 0;
                background: #fff;
            }

            .receipt {
                width: 58mm;
                max-width: 58mm;
                margin: 0;
                padding: 3mm;
            }

            .buttons {
                display: none;
            }
        }

    </style>

</head>


<body>


<div class="receipt" id="receipt">

    <!-- =========================
         HEADER
    ========================= -->

    <div class="center">

        <div class="shop-name">
            TAANISH
        </div>

        <div class="shop-subtitle">
            FANCY STORE
        </div>

        <div class="shop-info">
            Thank you for shopping with us
        </div>

    </div>


    <div class="line"></div>


    <!-- =========================
         INVOICE INFORMATION
    ========================= -->

    <div class="invoice-info">

        <div class="invoice-row">
            <strong>Invoice</strong>

            <span
                class="invoice-value"
                id="invoiceNumber">
                Loading...
            </span>
        </div>


        <div class="invoice-row">
            <strong>Date</strong>

            <span
                class="invoice-value"
                id="invoiceDate">
                Loading...
            </span>
        </div>


        <div class="invoice-row">
            <strong>Customer</strong>

            <span
                class="invoice-value"
                id="customerName">
                Walk-in Customer
            </span>
        </div>

    </div>


    <div class="line"></div>


    <!-- =========================
         ITEMS
    ========================= -->

    <table>

        <thead>

            <tr>

                <th class="item">
                    Item
                </th>

                <th class="mrp">
                    MRP
                </th>

                <th class="rate">
                    Rate
                </th>

                <th class="qty">
                    Qty
                </th>

                <th class="total">
                    Total
                </th>

            </tr>

        </thead>


        <tbody id="itemsBody"></tbody>

    </table>


    <div class="line"></div>


    <!-- =========================
         TOTAL
    ========================= -->

    <div class="summary">

        <div class="summary-row round-off">

            <span>
                Round Off
            </span>

            <span id="roundOff">
                ₹0.00
            </span>

        </div>


        <div class="summary-row grand-total">

            <span>
                GRAND TOTAL
            </span>

            <span>
                ₹<span id="grandTotal">
                    0.00
                </span>
            </span>

        </div>

    </div>


    <!-- =========================
         PAYMENT
    ========================= -->

    <div class="payment">

        <div class="payment-row">

            <strong>
                Payment
            </strong>

            <span id="paymentMethod">
                Cash
            </span>

        </div>


        <div
            class="payment-row"
            id="cashReceivedRow"
            style="display:none;"
        >

            <strong>
                Cash Received
            </strong>

            <span id="cashReceived">
                ₹0.00
            </span>

        </div>


        <div
            class="payment-row change"
            id="changeRow"
            style="display:none;"
        >

            <strong>
                Change
            </strong>

            <span id="changeAmount">
                ₹0.00
            </span>

        </div>

    </div>


    <div class="line"></div>


    <!-- =========================
         FOOTER
    ========================= -->

    <div class="center thank-you">
        Thank you for shopping with TAANISH
    </div>

    <div class="center thank-sub">
        Please visit us again
    </div>


</div>


<!-- =========================
     BUTTONS
========================= -->

<div class="buttons">

    <button
        class="print-btn"
        onclick="window.print()">
        PRINT
    </button>

    <button
        class="back-btn"
        onclick="window.location.href='sales-history.html'">
        BACK
    </button>

</div>


<script>

const API_URL =
    "https://taanish.onrender.com";


/* =========================
   AUTH
========================= */

const token =
    localStorage.getItem(
        "access_token"
    );


if (!token) {

    window.location.href =
        "login.html";

}


/* =========================
   LAST INVOICE
========================= */

const invoiceNumber =
    localStorage.getItem(
        "last_invoice_number"
    );


/* =========================
   AUTH HEADERS
========================= */

function authHeaders() {

    return {
        "Authorization":
            `Bearer ${token}`
    };

}


/* =========================
   LOAD RECEIPT
========================= */

async function loadReceipt() {

    try {

        if (!invoiceNumber) {

            throw new Error(
                "Invoice number not found."
            );

        }


        /* =========================
           GET SALES
        ========================= */

        const salesResponse =
            await fetch(
                `${API_URL}/sales/`,
                {
                    headers:
                        authHeaders()
                }
            );


        if (
            salesResponse.status === 401
        ) {

            localStorage.removeItem(
                "access_token"
            );

            window.location.href =
                "login.html";

            return;

        }


        if (!salesResponse.ok) {

            throw new Error(
                "Unable to load sales."
            );

        }


        const sales =
            await salesResponse.json();


        const sale =
            sales.find(
                s =>
                    s.invoice_number ===
                    invoiceNumber
            );


        if (!sale) {

            throw new Error(
                "Sale not found: " +
                invoiceNumber
            );

        }


        /* =========================
           SALE DETAILS
        ========================= */

        const detailResponse =
            await fetch(
                `${API_URL}/sales/${sale.id}`,
                {
                    headers:
                        authHeaders()
                }
            );


        const detailedSale =
            detailResponse.ok
                ? await detailResponse.json()
                : sale;


        /* =========================
           PRODUCTS
        ========================= */

        const productsResponse =
            await fetch(
                `${API_URL}/products/`,
                {
                    headers:
                        authHeaders()
                }
            );


        const products =
            productsResponse.ok
                ? await productsResponse.json()
                : [];


        const productMap = {};


        products.forEach(
            product => {

                productMap[
                    product.id
                ] = product;

            }
        );


        /* =========================
           BASIC INFO
        ========================= */

        document.getElementById(
            "invoiceNumber"
        ).textContent =
            detailedSale.invoice_number ||
            sale.invoice_number;


        const dateValue =
            detailedSale.created_at ||
            sale.created_at;


        if (dateValue) {

            const date =
                new Date(
                    dateValue
                );

            document.getElementById(
                "invoiceDate"
            ).textContent =
                date.toLocaleString(
                    "en-IN"
                );

        }


        document.getElementById(
            "customerName"
        ).textContent =

            detailedSale.customer_id

                ? `Customer #${detailedSale.customer_id}`

                : "Walk-in Customer";


        /* =========================
           ITEMS
        ========================= */

        const itemsBody =
            document.getElementById(
                "itemsBody"
            );


        itemsBody.innerHTML = "";


        const items =
            detailedSale.items ||
            sale.items ||
            [];


        let totalBeforeRound = 0;


        items.forEach(
            item => {

                const quantity =
                    Number(
                        item.quantity || 0
                    );


                const rate =
                    Number(
                        item.price || 0
                    );


                const itemTotal =
                    Number(
                        item.total
                    ) ||
                    (
                        quantity *
                        rate
                    );


                totalBeforeRound +=
                    itemTotal;


                const product =
                    productMap[
                        item.product_id
                    ] || {};


                const productName =
                    product.name ||
                    `Product #${item.product_id}`;


                const mrp =
                    Number(
                        product.mrp || 0
                    );


                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td class="item">
                        ${escapeHtml(
                            productName
                        )}
                    </td>

                    <td class="mrp">
                        ₹${mrp.toFixed(2)}
                    </td>

                    <td class="rate">
                        ₹${rate.toFixed(2)}
                    </td>

                    <td class="qty">
                        ${quantity}
                    </td>

                    <td class="total">
                        ₹${itemTotal.toFixed(2)}
                    </td>

                `;


                itemsBody.appendChild(
                    row
                );

            }
        );


        /* =========================
           ROUND OFF
        ========================= */

        const grandTotal =
            Math.round(
                totalBeforeRound
            );


        const roundOff =
            grandTotal -
            totalBeforeRound;


        document.getElementById(
            "roundOff"
        ).textContent =

            `${roundOff >= 0 ? "+" : ""}₹${roundOff.toFixed(2)}`;


        document.getElementById(
            "grandTotal"
        ).textContent =
            grandTotal.toFixed(2);


        /* =========================
           PAYMENT
        ========================= */

        const payment =
            detailedSale.payment_method ||
            sale.payment_method ||
            "Cash";


        document.getElementById(
            "paymentMethod"
        ).textContent =
            payment;


        /* =========================
           CASH
        ========================= */

        const savedCash =
            localStorage.getItem(
                "last_cash_received"
            );


        if (
            payment === "Cash" &&
            savedCash !== null
        ) {

            const cash =
                Number(savedCash);


            const change =
                cash -
                grandTotal;


            document.getElementById(
                "cashReceivedRow"
            ).style.display =
                "flex";


            document.getElementById(
                "cashReceived"
            ).textContent =
                `₹${cash.toFixed(2)}`;


            document.getElementById(
                "changeRow"
            ).style.display =
                "flex";


            document.getElementById(
                "changeAmount"
            ).textContent =
                `₹${change.toFixed(2)}`;

        }


    }

    catch (error) {

        console.error(error);


        document.getElementById(
            "receipt"
        ).innerHTML = `

            <div class="error">

                Failed to load receipt.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   START
========================= */

loadReceipt();

</script>


</body>
</html>
