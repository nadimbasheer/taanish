<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TAANISH - Receipt</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#f1f3f5;
    font-family:Arial,Helvetica,sans-serif;
    color:#111;
}

body{
    display:flex;
    justify-content:center;
    padding:20px;
}

/* =========================
   RECEIPT
========================= */

.receipt{
    width:58mm;
    background:#fff;
    padding:4mm 3mm;
    min-height:100mm;
    font-size:11px;
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    margin-bottom:8px;
}

.shop-name{
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:2px;
}

.shop-type{
    font-size:10px;
    font-weight:bold;
    letter-spacing:1px;
}

.shop-info{
    font-size:9px;
    margin-top:5px;
    line-height:1.4;
}

.divider{
    border-top:1px dashed #000;
    margin:8px 0;
}

/* =========================
   INVOICE INFO
========================= */

.info{
    font-size:10px;
    line-height:1.6;
}

.info-row{
    display:flex;
    justify-content:space-between;
    gap:5px;
}

.info-label{
    font-weight:bold;
}

/* =========================
   ITEMS
========================= */

.items{
    width:100%;
}

.item{
    padding:5px 0;
    border-bottom:1px dotted #aaa;
}

.item-name{
    font-weight:bold;
    font-size:10px;
    word-break:break-word;
}

.item-details{
    display:flex;
    justify-content:space-between;
    margin-top:2px;
    font-size:9px;
}

.item-details span{
    white-space:nowrap;
}

/* =========================
   TOTALS
========================= */

.totals{
    margin-top:7px;
    font-size:10px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    padding:2px 0;
}

.grand-total{
    font-size:14px;
    font-weight:800;
    border-top:1px solid #000;
    border-bottom:1px solid #000;
    padding:6px 0;
    margin-top:4px;
}

/* =========================
   PAYMENT
========================= */

.payment{
    margin-top:7px;
    font-size:10px;
}

.payment-row{
    display:flex;
    justify-content:space-between;
    padding:2px 0;
}

.change{
    font-weight:bold;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    margin-top:12px;
    font-size:9px;
    line-height:1.5;
}

.thank-you{
    font-weight:bold;
    font-size:10px;
}

/* =========================
   BUTTONS
========================= */

.actions{
    width:58mm;
    display:flex;
    gap:6px;
    margin-top:12px;
}

.actions button{
    flex:1;
    border:none;
    padding:10px 5px;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
}

.print-btn{
    background:#111827;
    color:#fff;
}

.back-btn{
    background:#e5e7eb;
    color:#111;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:20px 0;
    font-size:11px;
}

.error{
    text-align:center;
    color:#b42318;
    padding:20px 0;
    font-size:11px;
}

/* =========================
   PRINT
========================= */

@media print{

    @page{
        size:58mm auto;
        margin:0;
    }

    html,
    body{
        width:58mm;
        margin:0;
        padding:0;
        background:#fff;
    }

    body{
        display:block;
    }

    .receipt{
        width:58mm;
        min-height:0;
        padding:3mm 3mm;
        margin:0;
    }

    .actions{
        display:none !important;
    }

    .loading,
    .error{
        display:none;
    }

}

/* =========================
   SCREEN PREVIEW
========================= */

@media screen{

    .page-wrapper{
        display:flex;
        flex-direction:column;
        align-items:center;
    }

}

</style>

</head>

<body>

<div class="page-wrapper">

    <!-- RECEIPT -->

    <div class="receipt" id="receipt">

        <div class="loading">
            Loading receipt...
        </div>

    </div>


    <!-- ACTIONS -->

    <div class="actions">

        <button
            class="print-btn"
            onclick="printReceipt()"
        >
            PRINT
        </button>

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← NEXT SALE
        </button>

    </div>

</div>


<script>

const API_URL = "http://127.0.0.1:8000";

const token =
    localStorage.getItem("access_token");


/* =========================
   LOGIN CHECK
========================= */

if(!token){

    window.location.href =
        "login.html";

}


/* =========================
   AUTH
========================= */

function getHeaders(){

    return {

        "Authorization":
            "Bearer " + token,

        "Content-Type":
            "application/json"

    };

}


/* =========================
   MONEY
========================= */

function money(value){

    return "₹" +
        Number(value || 0)
        .toFixed(2);

}


/* =========================
   HTML SAFETY
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   DATE
========================= */

function formatDate(value){

    if(!value){

        return "-";

    }

    const date =
        new Date(value);

    if(
        isNaN(date.getTime())
    ){

        return String(value);

    }

    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================
   LOAD RECEIPT
========================= */

async function loadReceipt(){

    const receipt =
        document.getElementById(
            "receipt"
        );


    const invoiceNumber =
        localStorage.getItem(
            "last_invoice_number"
        );


    const saleId =
        localStorage.getItem(
            "last_sale_id"
        );


    if(!invoiceNumber && !saleId){

        receipt.innerHTML =
            `
            <div class="error">
                No invoice selected.
            </div>
            `;

        return;

    }


    try{

        let sale = null;


        /* =========================
           GET SALE
        ========================= */

        if(saleId){

            const response =
                await fetch(
                    API_URL +
                    "/sales/" +
                    saleId,
                    {
                        method:"GET",
                        headers:getHeaders()
                    }
                );


            if(
                response.status === 401
            ){

                localStorage.removeItem(
                    "access_token"
                );

                window.location.href =
                    "login.html";

                return;

            }


            if(!response.ok){

                throw new Error(
                    "Unable to load sale"
                );

            }


            sale =
                await response.json();

        }


        /* =========================
           PRODUCTS
        ========================= */

        let products = [];


        const productsResponse =
            await fetch(
                API_URL + "/products/",
                {
                    method:"GET",
                    headers:getHeaders()
                }
            );


        if(
            productsResponse.status === 401
        ){

            localStorage.removeItem(
                "access_token"
            );

            window.location.href =
                "login.html";

            return;

        }


        if(productsResponse.ok){

            products =
                await productsResponse.json();

        }


        const productMap = {};


        if(Array.isArray(products)){

            products.forEach(
                function(product){

                    productMap[
                        product.id
                    ] = product;

                }
            );

        }


        /* =========================
           SALE ITEMS
        ========================= */

        const items =
            Array.isArray(sale.items)
                ? sale.items
                : [];


        let itemsHtml = "";


        if(items.length === 0){

            itemsHtml =
                `
                <div class="item">
                    No items found
                </div>
                `;

        }
        else{

            items.forEach(
                function(item){

                    const product =
                        productMap[
                            item.product_id
                        ];


                    const productName =
                        product
                            ? product.name
                            : "Product #" +
                              item.product_id;


                    const quantity =
                        Number(
                            item.quantity || 0
                        );


                    const price =
                        Number(
                            item.price || 0
                        );


                    const total =
                        Number(
                            item.total ||
                            price * quantity
                        );


                    itemsHtml +=
                        `
                        <div class="item">

                            <div class="item-name">
                                ${escapeHtml(
                                    productName
                                )}
                            </div>

                            <div class="item-details">

                                <span>
                                    ${quantity} × ${money(price)}
                                </span>

                                <span>
                                    ${money(total)}
                                </span>

                            </div>

                        </div>
                        `;

                }
            );

        }


        /* =========================
           PAYMENT DATA
        ========================= */

        const paymentMethod =
            sale.payment_method ||
            "Cash";


        const cashReceived =
            localStorage.getItem(
                "last_cash_received"
            );


        const change =
            localStorage.getItem(
                "last_change"
            );


        let paymentHtml = "";


        if(paymentMethod === "Cash"){

            paymentHtml =
                `
                <div class="payment">

                    <div class="payment-row">
                        <span>Payment</span>
                        <strong>Cash</strong>
                    </div>

                    ${
                        cashReceived !== null
                        ?
                        `
                        <div class="payment-row">
                            <span>Cash Received</span>
                            <span>
                                ${money(cashReceived)}
                            </span>
                        </div>
                        `
                        :
                        ""
                    }

                    ${
                        change !== null
                        ?
                        `
                        <div class="payment-row change">
                            <span>Change</span>
                            <span>
                                ${money(change)}
                            </span>
                        </div>
                        `
                        :
                        ""
                    }

                </div>
                `;

        }
        else{

            paymentHtml =
                `
                <div class="payment">

                    <div class="payment-row">

                        <span>
                            Payment
                        </span>

                        <strong>
                            ${escapeHtml(
                                paymentMethod
                            )}
                        </strong>

                    </div>

                </div>
                `;

        }


        /* =========================
           CUSTOMER
        ========================= */

        const customer =
            sale.customer_id
                ? "Customer #" +
                  sale.customer_id
                : "Walk-in Customer";


        /* =========================
           RECEIPT HTML
        ========================= */

        receipt.innerHTML =
            `

            <div class="header">

                <div class="shop-name">
                    TAANISH
                </div>

                <div class="shop-type">
                    FANCY STORE
                </div>

                <div class="shop-info">
                    Thank you for shopping with us
                </div>

            </div>


            <div class="divider"></div>


            <div class="info">

                <div class="info-row">

                    <span class="info-label">
                        Invoice
                    </span>

                    <span>
                        ${escapeHtml(
                            sale.invoice_number ||
                            invoiceNumber ||
                            "-"
                        )}
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Date
                    </span>

                    <span>
                        ${escapeHtml(
                            formatDate(
                                sale.created_at
                            )
                        )}
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Customer
                    </span>

                    <span>
                        ${escapeHtml(
                            customer
                        )}
                    </span>

                </div>

            </div>


            <div class="divider"></div>


            <div class="items">

                ${itemsHtml}

            </div>


            <div class="totals">

                <div class="total-row">

                    <span>
                        Subtotal
                    </span>

                    <span>
                        ${money(
                            sale.subtotal
                        )}
                    </span>

                </div>


                <div class="total-row">

                    <span>
                        Discount
                    </span>

                    <span>
                        ${money(
                            sale.discount
                        )}
                    </span>

                </div>


                <div class="total-row">

                    <span>
                        Tax
                    </span>

                    <span>
                        ${money(
                            sale.tax
                        )}
                    </span>

                </div>


                <div class="total-row grand-total">

                    <span>
                        TOTAL
                    </span>

                    <span>
                        ${money(
                            sale.total
                        )}
                    </span>

                </div>

            </div>


            ${paymentHtml}


            <div class="divider"></div>


            <div class="footer">

                <div class="thank-you">
                    Thank you for shopping with TAANISH
                </div>

                <div>
                    Please visit us again
                </div>

            </div>

            `;

    }
    catch(error){

        console.error(
            "Receipt error:",
            error
        );


        receipt.innerHTML =
            `
            <div class="error">
                Unable to load receipt.
            </div>
            `;

    }

}


/* =========================
   PRINT
========================= */

function printReceipt(){

    /*
       Small delay allows the browser
       to finish rendering the receipt
       before opening print dialog.
    */

    setTimeout(
        function(){

            window.print();

        },
        100
    );

}


/* =========================
   NEXT SALE
========================= */

function goBack(){

    window.location.href =
        "sales.html";

}


/* =========================
   START
========================= */

loadReceipt();

</script>

</body>
</html>
