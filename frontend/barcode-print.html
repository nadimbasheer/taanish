<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TAANISH - Barcode Print</title>

    <!-- Barcode Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* ==============================
           MAIN SCREEN
        ============================== */

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        select,
        input,
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

        select,
        input {
            border: 1px solid #999;
            border-radius: 5px;
        }

        button {
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }


        /* ==============================
           50 × 30 MM LABEL
        ============================== */

        .label-preview {

            width: 50mm;
            height: 30mm;

            margin: 25px auto;

            padding: 1.5mm;

            background: white;

            border: 1px dashed #999;

            text-align: center;

            overflow: hidden;
        }


        /* TAANISH */

        .shop-name {

            font-size: 14px;

            font-weight: 800;

            line-height: 1;

            margin: 0;
        }


        /* PRODUCT NAME */

        .product-name {

            font-size: 10px;

            font-weight: 600;

            line-height: 1;

            margin-top: 1mm;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* BARCODE */

        .barcode {

            display: block;

            width: 45mm;

            height: 11mm;

            margin: 1.5mm auto 0 auto;
        }


        /* BARCODE NUMBER */

        .barcode-number {

            font-size: 8px;

            font-weight: 600;

            line-height: 1;

            margin-top: 0.5mm;
        }


        /* PRICE */

        .price {

            font-size: 10px;

            font-weight: 800;

            line-height: 1;

            margin-top: 1mm;
        }


        /* ==============================
           PRINT SETTINGS
        ============================== */

        @media print {

            @page {

                size: 50mm 30mm;

                margin: 0;
            }


            html,
            body {

                width: 50mm;

                height: 30mm;

                margin: 0;

                padding: 0;

                background: white;
            }


            .container {

                width: 50mm;

                height: 30mm;

                max-width: none;

                margin: 0;

                padding: 0;

                background: white;

                border-radius: 0;
            }


            /* Hide controls */

            .container > *:not(.label-preview) {

                display: none !important;
            }


            /* Actual printed label */

            .label-preview {

                display: block !important;

                width: 50mm;

                height: 30mm;

                margin: 0;

                padding: 1.5mm;

                border: none;

                background: white;

                overflow: hidden;
            }


            .shop-name {

                font-size: 14px;

                font-weight: 800;
            }


            .product-name {

                font-size: 10px;

                font-weight: 600;
            }


            .barcode {

                width: 45mm;

                height: 11mm;
            }


            .barcode-number {

                font-size: 8px;

                font-weight: 600;
            }


            .price {

                font-size: 10px;

                font-weight: 800;
            }
        }

    </style>
</head>


<body>


<div class="container">


    <h1>
        TAANISH Barcode Printer
    </h1>


    <!-- PRODUCT -->

    <div class="form-group">

        <label for="productSelect">
            Select Product
        </label>

        <select id="productSelect">

            <option value="">
                Loading products...
            </option>

        </select>

    </div>


    <!-- QUANTITY -->

    <div class="form-group">

        <label for="quantity">
            Number of Labels
        </label>

        <input
            type="number"
            id="quantity"
            value="1"
            min="1"
        >

    </div>


    <!-- PRINT BUTTON -->

    <button onclick="printLabel()">

        PRINT LABEL

    </button>


    <!-- ==============================
         50 × 30 MM LABEL
    ============================== -->

    <div
        class="label-preview"
        id="labelPreview"
    >


        <!-- SHOP NAME -->

        <div class="shop-name">

            TAANISH

        </div>


        <!-- PRODUCT NAME -->

        <div
            class="product-name"
            id="previewName"
        >

            Product Name

        </div>


        <!-- BARCODE -->

        <svg
            id="barcode"
            class="barcode"
        ></svg>


        <!-- BARCODE NUMBER -->

        <div
            class="barcode-number"
            id="previewBarcode"
        >

            Barcode

        </div>


        <!-- PRICE -->

        <div
            class="price"
            id="previewPrice"
        >

            ₹0

        </div>


    </div>


</div>


<script>


/* ==============================
   API
============================== */

const API_URL =
    "https://taanish.onrender.com";


/* ==============================
   LOGIN TOKEN
============================== */

const token =
    localStorage.getItem(
        "access_token"
    );


if (!token) {

    window.location.href =
        "login.html";

}


/* ==============================
   PRODUCTS
============================== */

let products = [];


/* ==============================
   LOAD PRODUCTS
============================== */

async function loadProducts() {

    try {

        const response =
            await fetch(
                `${API_URL}/products/`,
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        /* LOGIN EXPIRED */

        if (response.status === 401) {

            localStorage.removeItem(
                "access_token"
            );

            window.location.href =
                "login.html";

            return;
        }


        /* OTHER ERROR */

        if (!response.ok) {

            throw new Error(
                "Could not load products"
            );

        }


        /* GET PRODUCTS */

        products =
            await response.json();


        const select =
            document.getElementById(
                "productSelect"
            );


        select.innerHTML =
            `<option value="">
                Select a product
            </option>`;


        /* ADD PRODUCTS */

        products.forEach(
            product => {

                /* Only products with barcode */

                if (!product.barcode) {

                    return;

                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    product.id;


                option.textContent =
                    `${product.name} - ${product.barcode} - ₹${product.selling}`;


                select.appendChild(
                    option
                );

            }
        );


        /* PRODUCT CHANGE */

        select.addEventListener(
            "change",
            updatePreview
        );

    }


    catch (error) {

        console.error(error);


        document.getElementById(
            "productSelect"
        ).innerHTML =

            `<option value="">
                Failed to load products
            </option>`;

    }

}


/* ==============================
   UPDATE LABEL
============================== */

function updatePreview() {


    const id =
        document.getElementById(
            "productSelect"
        ).value;


    if (!id) {

        return;

    }


    const product =
        products.find(
            p =>
                String(p.id) ===
                String(id)
        );


    if (!product) {

        return;

    }


    /* PRODUCT NAME */

    document.getElementById(
        "previewName"
    ).textContent =
        product.name;


    /* BARCODE NUMBER */

    document.getElementById(
        "previewBarcode"
    ).textContent =
        product.barcode;


    /* PRICE */

    document.getElementById(
        "previewPrice"
    ).textContent =
        `₹${product.selling}`;


    /* GENERATE BARCODE */

    JsBarcode(
        "#barcode",
        product.barcode,
        {

            format: "CODE128",

            width: 1.7,

            height: 40,

            displayValue: false,

            margin: 0

        }
    );

}


/* ==============================
   PRINT LABEL
============================== */

function printLabel() {


    const id =
        document.getElementById(
            "productSelect"
        ).value;


    /* NO PRODUCT */

    if (!id) {

        alert(
            "Please select a product."
        );

        return;

    }


    const quantity =
        parseInt(
            document.getElementById(
                "quantity"
            ).value
        );


    /* INVALID QUANTITY */

    if (
        !quantity ||
        quantity < 1
    ) {

        alert(
            "Enter a valid quantity."
        );

        return;

    }


    /*
       First physical test:
       one label only.
    */

    if (quantity !== 1) {

        alert(
            "For the first test, please print only 1 label."
        );

        return;

    }


    /* OPEN PRINT DIALOG */

    window.print();

}


/* ==============================
   START
============================== */

loadProducts();


</script>


</body>
</html>
