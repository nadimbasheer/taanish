<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAANISH - Barcode Print</title>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        select,
        input,
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

        button {
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #111;
            color: white;
        }

        .label-preview {
            width: 58mm;
            height: 25mm;
            margin: 25px auto;
            border: 1px dashed #999;
            background: white;
            padding: 2mm;
            text-align: center;
            overflow: hidden;
        }

        .shop-name {
            font-size: 11px;
            font-weight: bold;
            line-height: 1;
        }

        .product-name {
            font-size: 9px;
            margin-top: 1mm;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .barcode {
            width: 48mm;
            height: 10mm;
            margin-top: 1mm;
        }

        .barcode-number {
            font-size: 8px;
            line-height: 1;
        }

        .price {
            font-size: 9px;
            font-weight: bold;
            margin-top: 1mm;
        }

        @media print {
            @page {
                size: 58mm 25mm;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
                background: white;
            }

            .container {
                display: none;
            }

            .label-preview {
                display: block;
                width: 58mm;
                height: 25mm;
                margin: 0;
                border: none;
                padding: 2mm;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>TAANISH Barcode Printer</h1>

    <div class="form-group">
        <label for="productSelect">Select Product</label>
        <select id="productSelect">
            <option value="">Loading products...</option>
        </select>
    </div>

    <div class="form-group">
        <label for="quantity">Number of Labels</label>
        <input type="number" id="quantity" value="1" min="1">
    </div>

    <button onclick="printLabel()">PRINT LABEL</button>

    <div class="label-preview" id="labelPreview">
        <div class="shop-name">TAANISH</div>
        <div class="product-name" id="previewName">Product Name</div>

        <svg id="barcode" class="barcode"></svg>

        <div class="barcode-number" id="previewBarcode">
            Barcode
        </div>

        <div class="price" id="previewPrice">
            ₹0
        </div>
    </div>

</div>

<script>
const API_URL = "https://taanish.onrender.com";

const token = localStorage.getItem("access_token");

if (!token) {
    window.location.href = "login.html";
}

let products = [];

async function loadProducts() {
    try {
        const response = await fetch(`${API_URL}/products/`, {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        if (response.status === 401) {
            localStorage.removeItem("access_token");
            window.location.href = "login.html";
            return;
        }

        if (!response.ok) {
            throw new Error("Could not load products");
        }

        products = await response.json();

        const select = document.getElementById("productSelect");

        select.innerHTML = `
            <option value="">Select a product</option>
        `;

        products.forEach(product => {
            if (!product.barcode) return;

            const option = document.createElement("option");

            option.value = product.id;

            option.textContent =
                `${product.name} - ${product.barcode} - ₹${product.selling}`;

            select.appendChild(option);
        });

        select.addEventListener("change", updatePreview);

    } catch (error) {
        console.error(error);

        document.getElementById("productSelect").innerHTML =
            `<option value="">Failed to load products</option>`;
    }
}

function updatePreview() {

    const id = document.getElementById("productSelect").value;

    if (!id) {
        return;
    }

    const product = products.find(p => String(p.id) === String(id));

    if (!product) {
        return;
    }

    document.getElementById("previewName").textContent =
        product.name;

    document.getElementById("previewBarcode").textContent =
        product.barcode;

    document.getElementById("previewPrice").textContent =
        `₹${product.selling}`;

    JsBarcode("#barcode", product.barcode, {
        format: "CODE128",
        width: 1.4,
        height: 35,
        displayValue: false,
        margin: 0
    });
}

function printLabel() {

    const id = document.getElementById("productSelect").value;

    if (!id) {
        alert("Please select a product.");
        return;
    }

    const quantity =
        parseInt(document.getElementById("quantity").value);

    if (!quantity || quantity < 1) {
        alert("Enter a valid quantity.");
        return;
    }

    /*
       For the first test we print one label.
       Quantity printing will be expanded after
       the first physical printer test.
    */

    if (quantity !== 1) {
        alert("For the first test, please print only 1 label.");
        return;
    }

    window.print();
}

loadProducts();
</script>

</body>
</html>
