<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TAANISH - Barcode Print</title>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* =========================
           SCREEN
        ========================= */

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        select,
        input,
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

        select,
        input {
            border: 1px solid #999;
            border-radius: 5px;
        }

        button {
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }


        /* =========================
           50 × 30 MM LABEL
        ========================= */

        .label-preview {
            width: 50mm;
            height: 30mm;

            margin: 25px auto;

            padding: 0.8mm 1.5mm;

            background: white;

            border: 1px dashed #999;

            text-align: center;

            overflow: hidden;
        }


        /* TAANISH */

        .shop-name {
            font-size: 13px;
            font-weight: 800;

            line-height: 3.5mm;
            height: 3.5mm;

            margin: 0;
        }


        /* PRODUCT */

        .product-name {
            font-size: 9px;
            font-weight: 600;

            line-height: 3.5mm;
            height: 3.5mm;

            margin: 0;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* BARCODE */

        .barcode {
            display: block;

            width: 45mm;
            height: 9mm;

            margin: 0.5mm auto 0;
        }


        /* BARCODE NUMBER */

        .barcode-number {
            font-size: 7px;
            font-weight: 600;

            line-height: 3mm;
            height: 3mm;

            margin: 0;
        }


        /* PRICE */

        .price {
            font-size: 9px;
            font-weight: 800;

            line-height: 3.5mm;
            height: 3.5mm;

            margin: 0;
        }


        /* =========================
           PRINT
        ========================= */

        @media print {

            @page {
                size: 50mm 25mm;
                margin: 0;
            }

            html,
            body {
                width: 50mm;
                height: 30mm;

                margin: 0;
                padding: 0;

                background: white;
            }

            .container {
                width: 50mm;
                height: 30mm;

                max-width: none;

                margin: 0;
                padding: 0;

                background: white;
                border-radius: 0;
            }

            .container > *:not(.label-preview) {
                display: none !important;
            }

            .label-preview {
                display: block !important;

                width: 50mm;
                height: 30mm;

                margin: 0;

                padding: 0.8mm 1.5mm;

                border: none;

                background: white;

                overflow: hidden;
            }

            .shop-name {
                font-size: 13px;
                line-height: 3.5mm;
                height: 3.5mm;
            }

            .product-name {
                font-size: 9px;
                line-height: 3.5mm;
                height: 3.5mm;
            }

            .barcode {
                width: 45mm;
                height: 9mm;

                margin: 0.5mm auto 0;
            }

            .barcode-number {
                font-size: 7px;
                line-height: 3mm;
                height: 3mm;
            }

            .price {
                font-size: 9px;
                line-height: 3.5mm;
                height: 3.5mm;
            }
        }

    </style>
</head>


<body>

<div class="container">

    <h1>
        TAANISH Barcode Printer
    </h1>


    <!-- PRODUCT -->

    <div class="form-group">

        <label for="productSelect">
            Select Product
        </label>

        <select id="productSelect">

            <option value="">
                Loading products...
            </option>

        </select>

    </div>


    <!-- QUANTITY -->

    <div class="form-group">

        <label for="quantity">
            Number of Labels
        </label>

        <input
            type="number"
            id="quantity"
            value="1"
            min="1"
        >

    </div>


    <!-- PRINT -->

    <button onclick="printLabel()">
        PRINT LABEL
    </button>


    <!-- =========================
         ACTUAL LABEL
         50 × 30 MM
    ========================= -->

    <div
        class="label-preview"
        id="labelPreview"
    >

        <!-- SHOP NAME -->

        <div class="shop-name">
            TAANISH
        </div>


        <!-- PRODUCT NAME -->

        <div
            class="product-name"
            id="previewName"
        >
            Product Name
        </div>


        <!-- BARCODE -->

        <svg
            id="barcode"
            class="barcode"
        ></svg>


        <!-- BARCODE NUMBER -->

        <div
            class="barcode-number"
            id="previewBarcode"
        >
            Barcode
        </div>


        <!-- PRICE -->

        <div
            class="price"
            id="previewPrice"
        >
            ₹0
        </div>

    </div>

</div>


<script>

    /* =========================
       API
    ========================= */

    const API_URL =
        "https://taanish.onrender.com";


    /* =========================
       AUTH
    ========================= */

    const token =
        localStorage.getItem(
            "access_token"
        );


    if (!token) {

        window.location.href =
            "login.html";

    }


    /* =========================
       PRODUCTS
    ========================= */

    let products = [];


    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

        try {

            const response =
                await fetch(
                    `${API_URL}/products/`,
                    {
                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            /* TOKEN EXPIRED */

            if (response.status === 401) {

                localStorage.removeItem(
                    "access_token"
                );

                window.location.href =
                    "login.html";

                return;
            }


            /* SERVER ERROR */

            if (!response.ok) {

                throw new Error(
                    "Could not load products"
                );

            }


            /* READ PRODUCTS */

            products =
                await response.json();


            const select =
                document.getElementById(
                    "productSelect"
                );


            select.innerHTML =
                `<option value="">
                    Select a product
                </option>`;


            /* ADD PRODUCTS TO DROPDOWN */

            products.forEach(
                product => {

                    if (!product.barcode) {
                        return;
                    }


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        product.id;


                    option.textContent =
                        `${product.name} - ${product.barcode} - ₹${product.selling}`;


                    select.appendChild(
                        option
                    );

                }
            );


            /* WHEN PRODUCT CHANGES */

            select.addEventListener(
                "change",
                updatePreview
            );

        }

        catch (error) {

            console.error(error);


            document.getElementById(
                "productSelect"
            ).innerHTML =

                `<option value="">
                    Failed to load products
                </option>`;

        }

    }


    /* =========================
       UPDATE LABEL
    ========================= */

    function updatePreview() {

        const id =
            document.getElementById(
                "productSelect"
            ).value;


        if (!id) {
            return;
        }


        const product =
            products.find(
                p =>
                    String(p.id) ===
                    String(id)
            );


        if (!product) {
            return;
        }


        /* PRODUCT NAME */

        document.getElementById(
            "previewName"
        ).textContent =
            product.name;


        /* BARCODE NUMBER */

        document.getElementById(
            "previewBarcode"
        ).textContent =
            product.barcode;


        /* PRICE */

        document.getElementById(
            "previewPrice"
        ).textContent =
            `₹${product.selling}`;


        /* GENERATE CODE 128 */

        JsBarcode(
            "#barcode",
            product.barcode,
            {
                format: "CODE128",

                width: 1.7,

                height: 34,

                displayValue: false,

                margin: 0
            }
        );

    }


    /* =========================
       PRINT LABEL
    ========================= */

    function printLabel() {

        const id =
            document.getElementById(
                "productSelect"
            ).value;


        if (!id) {

            alert(
                "Please select a product."
            );

            return;
        }


        const quantity =
            parseInt(
                document.getElementById(
                    "quantity"
                ).value
            );


        if (
            !quantity ||
            quantity < 1
        ) {

            alert(
                "Enter a valid quantity."
            );

            return;
        }


        /*
         * FIRST TEST
         * Print one label only.
         */

        if (quantity !== 1) {

            alert(
                "For the first test, please print only 1 label."
            );

            return;
        }


        window.print();

    }


    /* =========================
       START
    ========================= */

    loadProducts();

</script>

</body>
</html>
