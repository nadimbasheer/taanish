<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Fancy Shop</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-card {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 11px;
            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h1>Fancy Shop</h1>

        <p class="subtitle">
            Management System
        </p>

        <form onsubmit="login(event)">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message" class="message"></div>

    </div>


    <script>

        const API_URL = "https://taanish.onrender.com";


        async function login(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;


            const message =
                document.getElementById("message");


            message.textContent = "Logging in...";
            message.style.color = "#555";


            try {

                const response = await fetch(
                    API_URL + "/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const result = await response.json();


                if (!response.ok) {

                    message.textContent =
                        result.detail || "Login failed.";

                    message.style.color = "red";

                    return;
                }


                // Save JWT token
                localStorage.setItem(
                    "access_token",
                    result.access_token
                );


                message.textContent =
                    "Login successful!";

                message.style.color = "green";


                // Go to dashboard
                setTimeout(() => {

                    window.location.href = "index.html";

                }, 500);


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Could not connect to backend.";

                message.style.color = "red";
            }

        }

    </script>

</body>
</html>
